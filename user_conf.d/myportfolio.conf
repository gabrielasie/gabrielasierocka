# 10m of shared memory tracks client IPs; 1r/m means one timeline post
# per IP per minute, everything above that gets rejected.
limit_req_zone $binary_remote_addr zone=timeline_post:10m rate=1r/m;

server {
    listen 80;
    server_name gabisierocka.duckdns.org;

    location /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gabisierocka.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/gabisierocka.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gabisierocka.duckdns.org/privkey.pem;

    location = /api/timeline_post {
        limit_req zone=timeline_post;
        limit_req_status 429;

        resolver 127.0.0.11 valid=10s;
        set $upstream http://myportfolio:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://myportfolio:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
