{% extends "base.html" %}

{% block content %}
<div class="timeline-wrapper">
  <h1>Timeline</h1>

  <form id="timeline-form" class="timeline-form">
    <input type="text" name="name" id="name" placeholder="Your name" required>
    <input type="email" name="email" id="email" placeholder="Your email" required>
    <textarea name="content" id="content" placeholder="What's on your mind?" rows="3" required></textarea>
    <button type="submit">Post</button>
  </form>

  <div id="timeline-posts" class="timeline-posts"></div>
</div>

<style>
  .timeline-wrapper { max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  .timeline-form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
  .timeline-form input, .timeline-form textarea { padding: 0.6rem; font-size: 1rem; }
  .timeline-form button { padding: 0.6rem; font-size: 1rem; cursor: pointer; }
  .timeline-post { display: flex; gap: 0.75rem; padding: 1rem 0; border-bottom: 1px solid #ddd; }
  .timeline-post img { width: 48px; height: 48px; border-radius: 50%; }
  .timeline-post .meta { font-size: 0.85rem; color: #666; }
  .timeline-post .body { margin: 0.25rem 0 0; }
</style>

<script>
  async function md5(str) {
    // Gravatar needs an md5 hash of the lowercased, trimmed email.
    const data = new TextEncoder().encode(str.trim().toLowerCase());
    const buf = await crypto.subtle.digest("MD5", data).catch(() => null);
    if (!buf) return null;
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function gravatarUrl(hash) {
    return hash
      ? `https://www.gravatar.com/avatar/${hash}?d=identicon&s=48`
      : `https://www.gravatar.com/avatar/?d=identicon&s=48`;
  }

  async function renderPosts() {
    const res = await fetch("/api/timeline_post");
    const data = await res.json();
    const container = document.getElementById("timeline-posts");
    container.innerHTML = "";

    for (const post of data.timeline_posts) {
      const hash = await md5(post.email);
      const div = document.createElement("div");
      div.className = "timeline-post";
      div.innerHTML = `
        <img src="${gravatarUrl(hash)}" alt="avatar">
        <div>
          <div class="meta"><strong>${post.name}</strong> &middot; ${post.email} &middot; ${post.created_at}</div>
          <p class="body">${post.content}</p>
        </div>`;
      container.appendChild(div);
    }
  }

  document.getElementById("timeline-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const body = new URLSearchParams({
      name: form.name.value,
      email: form.email.value,
      content: form.content.value,
    });
    await fetch("/api/timeline_post", { method: "POST", body });
    form.reset();
    renderPosts();
  });

  renderPosts();
</script>
{% endblock %}
